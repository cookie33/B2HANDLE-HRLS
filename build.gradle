/*
 * This file was generated by the Gradle 'init' task.
 *
 * This project uses @Incubating APIs which are subject to change.
 */

// plugins
plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'project-report'
    id 'war'
}

// project naming and version. It is build for java 1.8 and higher
group = 'HandleReverseLookupServlet'
version = '1.0.13'
description = 'HandleReverseLookupServlet'
java.sourceCompatibility = JavaVersion.VERSION_1_8

// repositories to get libraries from
repositories {
    mavenCentral()
    mavenLocal()
    maven {
        url = uri('https://mvnrepository.com')
        url = uri('https://repo.maven.apache.org/maven2/')
        url = uri('https://download.oracle.com/maven')
    }
}

// Set resources directories to be src/de directory.
// Gradle excludes *.java files in resource directories by default
sourceSets {
  main {
    java { srcDirs = ["src/de"] }    // the source dirs for the java compiler
  }
}

// dependencies. Versions are assigned in gradle/libs.versions.toml
dependencies {
    api libs.org.glassfish.jersey.core.jersey.server
    api libs.org.glassfish.jersey.containers.jersey.container.servlet
    api libs.org.glassfish.jersey.media.jersey.media.json.jackson
    api libs.org.eclipse.jetty.jetty.server
    api libs.org.apache.logging.log4j.log4j.api
    api libs.org.apache.logging.log4j.log4j.core
    api libs.org.apache.logging.log4j.log4j.slf4j.impl
    api libs.org.apache.logging.log4j.log4j.web
    api libs.commons.logging.commons.logging
    api libs.mysql.mysql.connector.java
    api libs.org.apache.solr.solr.solrj
    api libs.com.mchange.c3p0
    api libs.jakarta.jws.jakarta.jws.api
    api libs.jakarta.xml.bind.jakarta.xml.bind.api
    api libs.javax.activation.javax.activation.api
    api libs.javax.servlet.javax.servlet.api
    api libs.javax.xml.bind.jaxb.api
}

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

// war file. To build a war file with teh correct web content and remove a duplicate jar
war {
    webInf { from 'WebContent/WEB-INF' } // adds a file-set to the WEB-INF dir.
    rootSpec.exclude("**/javax.inject-1.jar")
}
